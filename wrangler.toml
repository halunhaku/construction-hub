name = "construction-hub"
pages_build_output_dir = "dist"
compatibility_date = "2025-08-01"

# 首次部署前执行（在项目根目录）：
#   npx wrangler d1 create three-photos-db   # 把输出的 database_id 填入下方
#   npx wrangler r2 bucket create three-photos
#   npx wrangler d1 execute three-photos-db --file=schema.sql
[[d1_databases]]
binding = "DB"
database_name = "three-photos-db"
database_id = "8321e506-5e5a-4d1e-afb3-01e36f5b5d6a"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "three-photos"

# 登录账号在 D1 users 表，不写进本文件。
